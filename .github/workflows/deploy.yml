name: CI/CD Deploy to Alwaysdata

on:
  push:
    branches: ["main", "master"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Build Go Binary
        run: |
          go mod tidy
          GOOS=linux GOARCH=amd64 go build -o main .

      - name: Deploy to Alwaysdata via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "main"
          target: ${{ secrets.DEPLOY_FOLDER }}

      - name: Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_FOLDER }}
            chmod +x main
            # Restart via Alwaysdata API
            curl -s -X POST \
              --basic --user "${{ secrets.API_KEY }}account:" \
              "https://api.alwaysdata.com/v1/site/${{ secrets.APP_ID }}/restart/"
